server.port=8081
spring.application.name=visa-server
spring.webservices.path=/ws

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/visareg?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:visareg}
spring.datasource.password=${DB_PASSWORD:visareg123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Service Registry Configuration
registry.url=${REGISTRY_URL:http://localhost:8080/ws}
app.public-url=${APP_PUBLIC_URL:http://localhost:8081/ws}
