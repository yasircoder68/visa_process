server.port=8082
spring.application.name=registration-server
spring.webservices.path=/ws

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/visareg?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:visareg}
spring.datasource.password=${DB_PASSWORD:visareg123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# External APIs Configuration
nominatim.email=${NOMINATIM_EMAIL:amdyasircoder@gmail.com}
holiday.api.key=${HOLIDAY_API_KEY:}

# Service Registry Configuration
registry.url=${REGISTRY_URL:http://${REGISTRY_HOST:localhost}:8080/ws}
app.public-url=${APP_PUBLIC_URL:http://${APP_PUBLIC_HOST:localhost}:8082/ws}
