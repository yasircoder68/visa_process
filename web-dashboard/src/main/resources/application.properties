server.port=${PORT:3000}

spring.application.name=web-dashboard

# Database Configuration (MySQL validate mode)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:visareg}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:${DB_USER:visareg}}
spring.datasource.password=${DB_PASSWORD:visareg123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Service Registry Endpoint (the only configured service URL per Rule 2)
registry.url=${REGISTRY_URL:http://${REGISTRY_HOST:localhost}:8080/ws}

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
